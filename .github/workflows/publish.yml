name: Publish

# Packs FireMQ.Client and pushes it to nuget.org when a version tag such as v0.1.0 is
# pushed. To publish a tag that already exists, run the workflow by hand from main and
# pass the tag.
#
# The push uses nuget.org trusted publishing: NuGet/login swaps the job's GitHub OIDC
# token for an API key that is valid for one hour, so the repository has no NuGet secret.
# It needs a trusted publishing policy on nuget.org (owner FireMQ, repository
# firemq-dotnet, workflow file publish.yml, no environment) and the repository variable
# NUGET_USER set to the nuget.org profile name that owns the policy.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  publish:
    name: dotnet pack and nuget push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # The pushed tag, or the tag passed to a manual run.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Check for the NUGET_USER variable
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org profile name that owns the trusted publishing policy"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check that the tag matches the version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the version $version in Directory.Build.props"
            exit 1
          fi
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/FireMQ.Client -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/
      # The key from NuGet/login expires after an hour, so log in right before the push.
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
